apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-bridge-config
  namespace: default
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }

    processors:
      batch:
        send_batch_size: 1000
        timeout: 5s

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse.clickhouse.svc.cluster.local:9000?dial_timeout=10s&compress=lz4
        database: default
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        metrics_table_name: otel_metrics
        ttl: 24h
        create_schema: true

    service:
      pipelines:
        logs:    { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
        traces:  { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
        metrics: { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-clickhouse-bridge
  namespace: default
  labels: { app: otel-clickhouse-bridge }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-clickhouse-bridge } }
  template:
    metadata: { labels: { app: otel-clickhouse-bridge } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: otel-bridge-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-clickhouse-bridge
  namespace: default
spec:
  selector: { app: otel-clickhouse-bridge }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
