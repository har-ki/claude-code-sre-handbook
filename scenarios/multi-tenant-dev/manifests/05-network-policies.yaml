---
# 3. Dev namespaces — intra-namespace + egress to dev-shared
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-access
  namespace: dev-alice
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
  ingress:
   - from:
     - podSelector: {}
  egress:
   - to:
     - podSelector: {}
   - to:
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-shared
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-access
  namespace: dev-bob
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
  ingress:
   - from:
     - podSelector: {}
  egress:
   - to:
     - podSelector: {}
   - to:
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-shared
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-access
  namespace: dev-charlie
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
  ingress:
   - from:
     - podSelector: {}
  egress:
   - to:
     - podSelector: {}
   - to:
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-shared
---
# 4. Dev-shared — ingress from dev namespaces + egress back to dev namespaces
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-shared-access
  namespace: dev-shared
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
  ingress:
   - from:
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-alice
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-bob
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-charlie
  egress:
   - to:
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-alice
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-bob
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-charlie
---
# 5. Staging/Prod — deny all ingress (fully isolated from dev)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-from-dev
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
   - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-from-dev
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
   - Ingress
