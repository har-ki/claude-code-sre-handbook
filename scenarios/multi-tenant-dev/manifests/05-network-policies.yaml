---
# 1. Default Deny All — applied to ALL namespaces (zero-trust baseline)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: dev-alice
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: dev-bob
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
---
apiVersion: networking.k8s.io/v1
