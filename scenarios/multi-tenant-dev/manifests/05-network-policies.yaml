  name: default-deny-all
  namespace: dev-charlie
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: dev-shared
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
   - Ingress
   - Egress
---
# 2. DNS Access — allow all namespaces to reach kube-system DNS
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: dev-alice
spec:
  podSelector: {}
  policyTypes:
   - Egress
  egress:
   - to:
     - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
     - protocol: UDP
       port: 53
     - protocol: TCP
       port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: dev-bob
spec:
  podSelector: {}
  policyTypes:
