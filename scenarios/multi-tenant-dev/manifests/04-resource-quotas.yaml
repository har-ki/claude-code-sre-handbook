---
# Resource quotas for Alice's namespace (dev)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-alice-quota
  namespace: dev-alice
  labels:
    tenant: alice
    tier: dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    pods: "10"
    services: "5"
    persistentvolumeclaims: "5"
    secrets: "10"
    configmaps: "10"
---
