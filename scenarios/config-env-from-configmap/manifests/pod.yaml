apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: color-size-settings
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    env:
    - name: COLOR
      valueFrom:
        configMapKeyRef:
          name: color-settings
          key: color
    volumeMounts:
    - name: size-config
      mountPath: /etc/sizes/
      readOnly: true
  volumes:
  - name: size-config
    configMap:
      name: size-settings
