# Default deny all ingress and egress for dev-alice
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: dev-alice
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
