---
# Network policies for dev-shared namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-shared-access
  namespace: dev-shared
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow access from all dev namespaces
  - from:
    - namespaceSelector:
        matchLabels:
          tier: dev
  egress:
  # Allow access to system services
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  # Allow DNS queries to any destination
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow access to dev namespaces
  - to:
    - namespaceSelector:
        matchLabels:
          tier: dev
---
# Complete isolation for staging
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-isolation
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow access from within staging namespace
  - from:
    - namespaceSelector:
        matchLabels:
          tier: staging
  egress:
  # Allow access to system services only
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  # Allow DNS queries to any destination
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress within staging namespace
  - to:
    - namespaceSelector:
        matchLabels:
          tier: staging
---
