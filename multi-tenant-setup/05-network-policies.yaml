---
# Default deny all ingress traffic for dev-alice
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dev-alice
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Allow dev-alice to access dev-shared and system services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-alice-egress
  namespace: dev-alice
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow access to dev-shared namespace
  - to:
    - namespaceSelector:
        matchLabels:
          tier: shared
  # Allow access to system services (DNS, etc.)
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  # Allow DNS queries to any destination
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow all egress within same namespace
  - to:
    - namespaceSelector:
        matchLabels:
          tenant: alice
---
